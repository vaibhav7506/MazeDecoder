spring.application.name=maze-decoder
server.port=${PORT:8080}
maze.store.max-count=100
maze.store.ttl=PT30M
maze.store.cleanup-ms=60000
maze.allowed-origins=http://localhost:5173,http://localhost:3000
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
